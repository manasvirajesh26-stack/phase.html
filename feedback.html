<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Feedback Form</title>
</head>

<body>

    <header>
        <h1>Feedback Form</h1>

        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="profile.html">Profile</a></li>
                <li><a href="courses.html">Courses</a></li>
                <li><a href="feedback.html">Feedback</a></li>
                <li><a href="grades.html">Grades</a></li>
                <li><a href="contact.html">Contact</a></li>
            </ul>
        </nav>
    </header>

    <hr>

    <main>

        <h2>Share Your Feedback</h2>

        <p>
            Please fill in the form below to share your thoughts
            about the courses and the portal.
        </p>

        <form action="#" method="post">

            
            <label for="name">Name:</label>
            <br>
            <input type="text" id="name" name="name" required>
            <br><br>

            
            <label for="email">Email:</label>
            <br>
            <input type="email" id="email" name="email" required>
            <br><br>

            
            <label for="phone">Phone:</label>
            <br>
            <input type="tel" id="phone" name="phone">
            <br><br>

            
            <p>Gender:</p>

            <input type="radio" id="male" name="gender" value="male">
            <label for="male">Male</label>

            <input type="radio" id="female" name="gender" value="female">
            <label for="female">Female</label>

            <input type="radio" id="other" name="gender" value="other">
            <label for="other">Other</label>

            <br><br>

            
            <label for="courses">Select Course:</label>
            <br>

            <select id="courses" name="courses" required>
                <option value="">-- Select a Course --</option>
                <option value="HTML">HTML and Web Fundamentals</option>
                <option value="CSS">CSS</option>
                <option value="JavaScript">JavaScript</option>
                <option value="Python">Python</option>
                <option value="MySQL">MySQL</option>
            </select>

            <br><br>

            
            <label for="feedback">Your Feedback:</label>
            <br>

            <textarea
                id="feedback"
                name="feedback"
                rows="6"
                cols="40"
                placeholder="write your feedback here"
              required ></textarea>
                

            <br><br>

            
            <label for="rating">Rate the Portal:</label>
            <br>

            <select id="rating" name="rating" required>
                <option value="">-- Select Rating --</option>
                <option value="5">5 - Excellent</option>
                <option value="4">4 - Good</option>
                <option value="3">3 - Normal</option>
                <option value="2">2 - Fair</option>
                <option value="1">1 - Poor</option>
            </select>

            <br><br>

            
            <input
                type="checkbox"
                id="subscribe"
                name="subscribe"
                value="yes">

            <label for="subscribe">
                Subscribe to newsletters and updates
            </label>

            <br><br>

            
            <button type="submit">Submit</button>
            <button type="reset">Reset</button>

        </form>

    </main>

    <hr>

    <footer>
        <p>&copy; 2026 Student Portal. All rights reserved.</p>
    </footer>
</body>

</html>
